
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#0077ff,#00c6ff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .login-container{
            width:100%;
            max-width:400px;
            padding:20px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            background:white;
            padding:40px 30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
            animation:fadeIn 0.5s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-card h1{
            color:#0077ff;
            margin-bottom:10px;
        }

        .login-card p{
            color:#666;
            margin-bottom:30px;
        }

        .input-group{
            margin-bottom:20px;
            text-align:left;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            transition:0.3s;
            box-sizing:border-box;
        }

        .input-group input:focus{
            border-color:#0077ff;
            outline:none;
            box-shadow:0 0 10px rgba(0,119,255,0.2);
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:#0077ff;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .login-btn:hover{
            background:#005ed1;
            transform:translateY(-2px);
        }

        .signup-link{
            margin-top:20px;
            color:#555;
        }

        .signup-link a{
            color:#0077ff;
            text-decoration:none;
            font-weight:bold;
        }

        .signup-link a:hover{
            text-decoration:underline;
        }

        .logo{
            width:80px;
            height:80px;
            background:#0077ff;
            border-radius:50%;
            margin:0 auto 20px;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:32px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                OL
            </div>

            <h1>Welcome Back</h1>

            <p>
                Login to continue your learning journey
            </p>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                >

            </div>

            <button
                class="login-btn"
                onclick="loginUser()">

                Login

            </button>

            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Signup
                </a>

            </div>

        </div>

    </div>

    <script>

        function loginUser(){

            const email =
                document.getElementById(
                    "loginEmail"
                ).value;

            const password =
                document.getElementById(
                    "loginPassword"
                ).value;

            const storedUser =
                JSON.parse(
                    localStorage.getItem("user")
                );

            if(
                storedUser &&
                storedUser.email === email &&
                storedUser.password === password
            ){

                alert("Login Successful");

                window.location.href =
                    "courses.html";

            }else{

                alert(" Invalid Email or Password ");
            }
        }

    </script>

</body>

</html>
